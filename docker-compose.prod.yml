version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: kerstfilms_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kerstfilms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kerstfilms_backend_prod
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      TMDB_API_KEY: ${TMDB_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kerstfilms_network
      - traefik-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    labels:
      # Enable Traefik for backend API
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      
      # HTTP Router
      - "traefik.http.routers.kerstfilms-api-http.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.kerstfilms-api-http.entrypoints=web"
      - "traefik.http.routers.kerstfilms-api-http.middlewares=redirect-to-https"
      
      # HTTPS Router
      - "traefik.http.routers.kerstfilms-api-https.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.kerstfilms-api-https.entrypoints=websecure"
      - "traefik.http.routers.kerstfilms-api-https.tls=true"
      - "traefik.http.routers.kerstfilms-api-https.tls.certresolver=le"
      
      # Strip prefix middleware
      - "traefik.http.middlewares.kerstfilms-api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.kerstfilms-api-https.middlewares=kerstfilms-api-stripprefix"
      
      # Service
      - "traefik.http.services.kerstfilms-api.loadbalancer.server.port=8000"

  # React Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: kerstfilms_frontend_prod
    restart: always
    depends_on:
      - backend
    networks:
      - kerstfilms_network
      - traefik-net
    labels:
      # Enable Traefik for frontend
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      
      # HTTP Router
      - "traefik.http.routers.kerstfilms-frontend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.kerstfilms-frontend-http.entrypoints=web"
      - "traefik.http.routers.kerstfilms-frontend-http.middlewares=redirect-to-https"
      
      # HTTPS Router
      - "traefik.http.routers.kerstfilms-frontend-https.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.kerstfilms-frontend-https.entrypoints=websecure"
      - "traefik.http.routers.kerstfilms-frontend-https.tls=true"
      - "traefik.http.routers.kerstfilms-frontend-https.tls.certresolver=le"
      
      # Service
      - "traefik.http.services.kerstfilms-frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  kerstfilms_network:
    driver: bridge
  traefik-net:
    external: true

